# Rate limiting (http context, conf.d içinden geçerli). Genel /api/ trafiği
# için cömert bir limit: normal panel kullanımını etkilemez, brute-force ve
# run-away döngüleri frenler. Login uç noktası daha sıkı.
limit_req_zone $binary_remote_addr zone=api_general_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth_global:10m rate=5r/s;
# 2026-09-26 (#79): /ws korumasızdı — tek istemci sınırsız eşzamanlı WS bağlantı açabiliyordu.
limit_conn_zone $binary_remote_addr zone=ws_per_ip_global:10m;

upstream backend_pool {
    server backend_global:8005;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    server frontend_global:3005;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Güvenlik başlıkları. TLS Coolify tarafında sonlanır; HSTS yine de tarayıcıya iletilir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Gateway timeout / bad gateway durumlarında kullanıcı dostu JSON hata yanıtı
    proxy_intercept_errors on;
    error_page 502 503 504 = /backend_unavailable.json;

    location = /backend_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"ok":false,"error":"Backend servislerine şu an ulaşılamıyor. Lütfen birkaç saniye sonra tekrar deneyin."}';
    }

    location = /api/auth/login {
        limit_req zone=api_auth_global burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=api_general_global burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok";
    }

    location /health {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /ws {
        limit_conn ws_per_ip_global 10;
        limit_conn_status 429;
        proxy_intercept_errors off;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    location /_next/static/ {
        proxy_intercept_errors off;
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    location / {
        proxy_pass http://frontend_pool;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
