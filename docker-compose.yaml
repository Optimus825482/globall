# ═════════════════════════════════════════════════════════════════════════
# (2026-09-27) BU DOSYA ARTIK YALNIZ GLOBAL ÖRNEĞİNİ TANIMLAR.
#
# Binance TR örneği (`postgres` / `backend` / `frontend` / `gateway` /
# `db-backup`) bu dosyadan KALDIRILDI. Kullanıcı kararı: TR uygulaması
# ayrı bir repo ve ayrı bir Coolify kaynağı olarak kendi konteynerinde
# çalışıyor — `Optimus825482/sclpragnt` + `scalper.erkanerdem.online`.
# Burada yalnız Global (USDT) örneği yaşar: `global.erkanerdem.online`.
#
# NEDEN ÖNEMLİ (operasyonel, 2026-09-27):
#   İki örnek aynı host'ta 8 GB RAM ile birlikte çalışamıyordu —
#   mem_limit'ler toplamı ~10.7 GB'a çıkıyordu, host'un kapasitesi 8 GB.
#   Bu, deploy'un `backend is unhealthy` ile düşmesinin muhtemel
#   kaynaklarından biriydi. Tek stack'e inmek bu baskıyı kaldırır.
#
# `nginx/` dizini TR gateway'inin yapılandırmasıdır ve artık KULLANILMAZ
# (`gateway` servisi yok). Zararsız bırakıldı; silinmesi ayrı bir iş.
# ═════════════════════════════════════════════════════════════════════════

# Tüm servisler için Docker log rotasyonu (varsayılan sınırsız büyür).
# YAML anchor'ı kullanımdan ÖNCE tanımlanmalıdır.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 2026-09-26 denetim düzeltmesi (#74): Sembol evreni ~309'a çıkmış durumda;
# backend tek başına çok sayıda sembol tarıyor. HİÇBİR serviste
# `mem_limit`/`cpus`/`deploy.resources` yoktu → tek host'ta bir konteynerin
# OOM'u tüm stack'i (postgres dahil) düşürüyordu, veri erişilemez hale
# geliyordu. Limitler sembol evreni büyüdükçe gözden geçirilmelidir.
# NOT: `deploy.resources.limits` Compose v2'de uygulanır ( swarm dışında da
# `mem_limit`/`cpus` bridge modunda desteklenir; ikisini birlikte yazmak
# Swarm uyumluluğunu korur).
services:
  # ═════════════════════════════════════════════════════════════════════════
  # BİNANCE GLOBAL ÖRNEĞİ (USDT)
  # ═════════════════════════════════════════════════════════════════════════
  # `scalper_global` adlı KENDİ DB'si vardır — TR örneğiyle hiçbir şey
  # paylaşmaz (ayrı host, ayrı repo, ayrı Coolify kaynağı).
  postgres_global:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    stop_grace_period: 10s
    exclude_from_hc: true
    labels:
      - "traefik.enable=false"
    # #74 ile aynı gerekçe: limitli konteyner. Global DB'si TR'den
    # küçük olduğu için bellek tavanı da düşük tutuldu; sınırsız
    # bırakılırsa konteyner host'u OOM'a düşürebilir.
    mem_limit: 768m
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    environment:
      # ⚠️ `POSTGRES_DB` Global örneğinde `scalper_global` OLMAK ZORUNLU.
      # Backend'de `DATABASE_URL` bu ismi gösterir; `database.py` tabloları
      # `search_path` ile bu DB'de arar. İsim başka olursa backend kendi
      # tablolarını bulamaz ve `init_db` sessizce yeni tablolar yaratır.
      POSTGRES_DB: ${POSTGRES_DB_GLOBAL:-scalper_global}
      POSTGRES_USER: ${POSTGRES_USER_GLOBAL:-scalper}
      # ⚠️ TR yedeği YOK: `${POSTGRES_PASSWORD_GLOBAL:-${POSTGRES_PASSWORD:?...}}`
      # Coolify'da iç içe varsayılan çözülmedi ve hata metni parola yerine
      # geçti → postgres'e "POSTGRES_PASSWORD must be set" ile bağlandı
      # (2026-09-27 deploy kazası). Artık eksik değişken AÇIK hata verir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_GLOBAL:?POSTGRES_PASSWORD_GLOBAL must be set}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - scalper_postgres_global_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_GLOBAL:-scalper} -d ${POSTGRES_DB_GLOBAL:-scalper_global}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  backend_global:
    build:
      context: ./backend
    # Aynı imaj iki dağıtımda da kullanılıyordu; TR örneği kaldırıldığı için
    # artık tek tüketicisi var. Borsa kimliği env'den geldiği için imaj
    # borsadan bağımsızdır — yeniden adlandırmaya gerek yok, Coolify bu
    # ismi kaynak bazında izliyor.
    image: scalperagent-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    labels:
      - "traefik.enable=false"
    # ⚠️ Port BİLEREK burada sabitleniyor. `backend/Dockerfile:18,20` 8004'i
    # DÜZ yazıyor (EXPOSE + CMD). Global örneği 8005'i konuşuyor
    # (`nginx-global/default.conf:35` ve aşağıdaki healthcheck).
    # Dockerfile'dan override yoksa uvicorn 8004'te açılır, healthcheck
    # 8005'e gider ve konteyner sağlıklı görünmeden ÖLÜR — 2026-09-27'deki
    # deploy'un ikinci gizli hatası bu olurdu. Kaynak kod iki yerde
    # (Dockerfile + compose) yaşadığı için burada tek doğru yer bırakıldı.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--timeout-keep-alive", "65", "--backlog", "4096"]
    # #74: en yüksek tüketici — 309 sembollük evrende scanner + LLM + WS
    # yayıncısı aynı süreçte. 2G / 2 CPU.
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    depends_on:
      postgres_global:
        condition: service_healthy
    environment:
      # SCALPER_ENV=production mevcut parolayla açılmayı REDDEDER —
      # `config.py:enforce_admin_password_policy` import sırasında
      # RuntimeError fırlatır ve uvicorn hiç açılmaz. Parola güçlendirilip
      # bu değer "production" yapılmalıdır.
      SCALPER_ENV: ${SCALPER_ENV:-development}
      SCALPER_DB_PATH: /data/scalper_db_v4.sqlite
      # ⚠️ ASLA düz metin parola YAZILMAZ — bu URL env'den bileşik kurulur.
      # `.env` gitignore'da (`.gitignore:1-2`).
      DATABASE_URL: postgresql://${POSTGRES_USER_GLOBAL:-scalper}:${POSTGRES_PASSWORD_GLOBAL:?POSTGRES_PASSWORD_GLOBAL must be set}@postgres_global:5432/${POSTGRES_DB_GLOBAL:-scalper_global}
      DB_BACKEND: postgres
      LIVE_TRADING: "false"
      USE_TESTNET: "false"
      TZ: ${TZ:-Europe/Istanbul}
      # Borsa kimliği ve para birimi env'den. `config.py:_resolve_exchange`
      # bunları okur; bilinen değilse warning basıp TR'ye düşer (sessizce
      # yanlış borsada çalışmayı engeller).
      EXCHANGE: binance_global
      QUOTE_ASSET: USDT
      # Likidite tabanı borsanın ölçeğinde. Varsayılan 120.000 USDT
      # Global'de ÖLÇÜLDÜ (20K/50K/120K/300K tabanlarının hepsinde havuz
      # 10 kazanan / 8 hareketli çıktı → taban şişkin değil). Aşılırsa
      # tarama genişliği düşer.
      MIN_QUOTE_VOLUME_USDT: ${MIN_QUOTE_VOLUME_USDT:-120000}
      # Balina tespiti eşiği — env'sizdi; USDT'de ölçülmüş değer.
      WHALE_NOTIONAL: ${WHALE_NOTIONAL:-25000}
      # Bu deployment'ın kalıcı adresi. Traefik (Coolify) TLS'i sonlandırıp
      # `gateway_global`'e yönlendirir; tarayıcı origin'i bu domain olur.
      # Boş bırakılırsa `main.py` localhost varsayılanına düşer ve
      # production'da "Access-Control-Allow-Origin" eksikliğiyle tüm fetch'ler
      # reddedilir — bu yüzden varsayılan boş DEĞİL, gerçek domain'dir.
      CORS_ORIGINS: ${CORS_ORIGINS_GLOBAL:-https://global.erkanerdem.online}
      SCALPER_ADMIN_PASSWORD: ${SCALPER_ADMIN_PASSWORD_GLOBAL:?SCALPER_ADMIN_PASSWORD_GLOBAL must be set}
      # ⚠️ AYRI SESSION SECRET. Aynı secret iki örnek arasında çerez
      # geçerliliği aktarırdı. TR örneği ayrı host'ta olduğu için bu artık
      # o örnekle çakışmaz — ama secret'ı yine de güçlü/tahmin edilemez
      # tutmak doğru; `SCALPER_COOKIE_SECURE=1` ile birlikte kullanılır.
      SCALPER_SESSION_SECRET: ${SCALPER_SESSION_SECRET_GLOBAL:?SCALPER_SESSION_SECRET_GLOBAL must be set}
      SCALPER_COOKIE_SECURE: ${SCALPER_COOKIE_SECURE:-1}
      # ⚠️ TR yedeği YOK (2026-09-27) — parola kazasının aynı deseni: Coolify
      # iç içe varsayılanı çözmedi, hata metnini Fernet anahtarı yerine koydu.
      # Böyle bir anahtarla LLM ayarları ŞİFRELENMEZ; hata fırlatmaz, sadece
      # "şifreli görünür" veri üretir. Eksik değişken artık AÇIK hata verir.
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY_GLOBAL:?LLM_ENCRYPTION_KEY_GLOBAL must be set}
      LLM_ALLOW_PRIVATE_PROVIDER: ${LLM_ALLOW_PRIVATE_PROVIDER:-0}
      TOP_GAINERS_AUTO_ACTIVATE: ${TOP_GAINERS_AUTO_ACTIVATE:-true}
      TOP_GAINERS_LIMIT: ${TOP_GAINERS_LIMIT:-10}
      TOP_GAINERS_REFRESH_SEC: ${TOP_GAINERS_REFRESH_SEC:-600}
      # Web Push aboneliği bir "application server key"e bağlıdır ve
      # tarayıcı bunu ORIGIN ile eşleştirir. Bu ikili Aynı anda ya da hiç
      # konmamalıdır: public/private eşleşmezse abonelik sessizce ölür
      # (`app/vapid.py:131-138` bunu başlangıçta loglar).
      #
      # ⚠️ 2026-09-27 düzeltmesi: bu satır `:-${VAPID_PRIVATE_KEY:-}` idi ve
      # Coolify'da ham `${VAPID_PRIVATE_KEY:-}` metnini değere yazıyordu —
      # parola kazasının aynı sınıfı. Boş bırakılabilir olması, "push
      # çalışmıyor" belirtisini "anahtar yok" yerine "anahtar bozuk" gibi
      # göstereceği için yedeği kaldırıldı. Boş bırakmak push'u kapatır,
      # yanlış anahtar ise push'u sessizce bozar.
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY_GLOBAL:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT_GLOBAL:-mailto:alerts@global.erkanerdem.online}
      # 2026-09-27: otonom paper'ın minimum emir tutarı. Varsayılan 2 USDT
      # (config.py borsa ölçeğinden türetir: TRY→50, Global→2). 50 TRY'nin
      # Global'daki karşılığı ≈1,5 USDT; eski sabit 50 burada ~35 kat şişkin
      # olurdu. DB'deki `auto_paper_settings.min_order_try` bunu geçersiz
      # kılabilir; env yalnız VARSAYILANı ve UI tabanını belirler.
      AUTO_PAPER_MIN_ORDER_TRY: ${AUTO_PAPER_MIN_ORDER_TRY_GLOBAL:-2.0}
      # Sanal cüzdan başlangıç bakiyesi. config.py varsayılanı zaten
      # quote-ölçekli (TRY→10000, Global→1000); bu env yalnız operatör
      # isterse üzerine yazar.
      INITIAL_BALANCE: ${INITIAL_BALANCE_GLOBAL:-1000.0}
      # TR Bridge: scalper.erkanerdem.online aktif değilse gereksiz ReadTimeoutError ve gecikmeyi önle
      BINANCE_TR_BRIDGE_ENABLED: ${BINANCE_TR_BRIDGE_ENABLED:-false}
    volumes:
      - scalper_global_data:/data
    expose:
      - "8005"
    healthcheck:
      # #74: timeout 3 -> 10 sn. `/health` sabit-zamanlı bir liveness ucu
      # (sembol taraması yok), ama 310 sembollük evrenin WS + history
      # kurulumu sırasında ilk bağlantılar thread havuzunda sıraya
      # girebiliyor. Probe komutunun kendi 10 sn timeout'ı ile eşleşir.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=10)"]
      start_period: 60s
      interval: 15s
      timeout: 12s
      retries: 10
    networks:
      - default
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  # AYRI frontend build'i ZORUNLU: `NEXT_PUBLIC_*` Next.js tarafından build
  # anında sabitlenir, çalışma anında env değişimi etkisizdir. Tek imaj hem
  # TRY hem USDT gösteremez (Dockerfile ARG'ı).
  frontend_global:
    build:
      context: ./frontend
      args:
        # Public key backend'deki `VAPID_PRIVATE_KEY`'den TÜRETİLMEZ —
        # elle eşleşmeli. Eşleşmezse tarayıcı push aboneliği sessizce
        # reddedilir (beyaz ekran değil, bildirim hiç gelmez).
        #
        # Üretin (backend konteynerinde) — format KESİNLİKLE şu olmalı:
        #   VAPID_PRIVATE_KEY_GLOBAL  = base64url(P-256 private, 32 bayt), padding'siz
        #   NEXT_PUBLIC_VAPID_PUBLIC_KEY_GLOBAL = base64url(X962 public, 65 bayt), padding'siz
        # `app/vapid.py:58-77` (ve `test_vapid_and_scheme.py:25-35`) tam olarak
        # bu biçimi bekliyor; PEM üretirsen private "geçersiz" sayılır.
        #   python - <<'PY'
        #   from cryptography.hazmat.primitives.asymmetric import ec
        #   from cryptography.hazmat.primitives import serialization as s
        #   import base64
        #   k = ec.generate_private_key(ec.SECP256R1())
        #   raw = k.private_numbers().private_value.to_bytes(32, "big")
        #   pub = k.public_key().public_bytes(
        #       encoding=s.Encoding.X962, format=s.PublicFormat.UncompressedPoint)
        #   enc = lambda b: base64.urlsafe_b64encode(b).decode().rstrip("=")
        #   print("VAPID_PRIVATE_KEY_GLOBAL=" + enc(raw))
        #   print("NEXT_PUBLIC_VAPID_PUBLIC_KEY_GLOBAL=" + enc(pub))
        #   PY
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY_GLOBAL:-}
        NEXT_PUBLIC_QUOTE_ASSET: USDT
    restart: unless-stopped
    stop_grace_period: 5s
    labels:
      - "traefik.enable=false"
    # ⚠️ Aynı tuzak frontend'de de var: `frontend/Dockerfile:25,34` PORT'u
    # 3004 olarak DÜZ yazıyor. Global örneği 3005'i konuşuyor
    # (`nginx-global/default.conf:36` ve healthcheck). Ayrı `PORT` env'i
    # Next.js standalone sunucusunda `server.js` tarafından okunur ve
    # Dockerfile'ın ENV'sini ezer — `command`/`environment` gereksiz.
    # #74: Next.js build sürecinde (node) ve çalışırken 1G / 1 CPU.
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      backend_global:
        # UI shell'in API'nin healthy olmasına ihtiyacı yok; backend
        # ısınması yavaşsa konteyner "Created"da kalmasın.
        condition: service_started
    environment:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY_GLOBAL:-}
      PORT: "3005"
    expose:
      - "3005"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3005/ || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Kullanıcının dış erişimi bu konteyner üzerinden olur: hem Next.js
  # arayüzünü hem `/api/`'yi hem `/ws`'i AYNI origin'de sunar. Bu yüzden
  # `backend_global`/`frontend_global` için Coolify'da domain GİRİLMEMELİ —
  # yalnız bu servis alan alır (`global.erkanerdem.online`).
  #
  # Traefik (coolify-proxy) yalnızca kendi ağında bulduğu konteynerlere
  # route oluşturur. Ağ compose dışında tanımlı EXTERNAL olmalıdır
  # (Coolify kurulumunda zaten vardır).
  gateway_global:
    build:
      context: ./nginx-global
    image: scalperagent-gateway-global:latest
    restart: unless-stopped
    stop_grace_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.gateway_global.loadbalancer.server.port=80"
      - "traefik.http.services.gateway_global.loadbalancer.healthcheck.path=/gateway-health"
      - "traefik.http.services.gateway_global.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.gateway_global.loadbalancer.healthcheck.timeout=3s"
    # #74: nginx düşük ayak izli; 1G üst sınç yeterli (rate-limit zone'ları
    # 10m × 3 = ~30 MB). 1 CPU.
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      - frontend_global
      - backend_global
    expose:
      - "80"
    networks:
      - default
      - coolify
    healthcheck:
      # nginx'in kendi canlılığı: upstream'lere bağımlı DEĞİLDİR. /health
      # (backend proxy'si) kullanılsaydı backend'deki her kısa tıkanıklık
      # gateway'i unhealthy yapardı. `localhost` yerine 127.0.0.1 —
      # /etc/hosts'ta localhost ::1'e çözümlenir, nginx yalnız IPv4
      # dinlediğinden wget "Connection refused" alıp unhealthy oluyordu.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/gateway-health || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Otomatik gece yedeği: her 24 saatte bir pg_dump. Saklama 1 GÜN
  # (2026-09-16): 7 günlük pencere DB boyutunun 7 KATI yer tutuyordu (tek
  # disk, %86 dolu) ve en güncel dump eski bir dump'tan daha değerlidir.
  # Bu stack'te TEK DB olduğu için `db-backup` (TR) kaldırıldı.
  #
  # ./local_backups_global host'a bağlanır (gitignored).
  # Restore: `cat <dump> | docker exec -i <postgres_global> psql -U scalper scalper_global`
  db-backup-global:
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    exclude_from_hc: true
    labels:
      - "traefik.enable=false"
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      backend_global:
        # Backend ancak migration'ı geçince sağlıklı olur. pg_dump tüm
        # tablolara dakikalarca ACCESS SHARE kilit alır; migration'ın
        # ALTER TABLE'ı ile açılış yarışını böylece kökten engelleriz.
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD_GLOBAL:?POSTGRES_PASSWORD_GLOBAL must be set}
    volumes:
      # Ayrı dizin: eskiden TR ile paylaşılan `local_backups` altındaydı ve
      # iki servisin "ilk 2 dump'u tut" kuralı birbirinin dosyalarını
      # siliyordu (her biri kuralı AYRI uyguluyordu).
      - ./local_backups_global:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        # İlk dump öncesi ek güvenlik penceresi (deploy/migration tamamen
        # dursun diye); sonraki döngüler 86400s uyur, yarışma olmaz.
        sleep 300
        # SAYI tabanlı saklama — en yeni 2 dump kalır, yaştan bağımsız.
        # Döngünün BAŞINDA da temizlenir ki redeploy fırtınasında birikmesin.
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          ls -1t /backups/scalper_global_*.dump 2>/dev/null | tail -n +3 | xargs -r rm -f
          echo "[backup-global] $$ts basliyor"
          if pg_dump -h postgres_global -U ${POSTGRES_USER_GLOBAL:-scalper} -d ${POSTGRES_DB_GLOBAL:-scalper_global} -Fc -f "/backups/scalper_global_$$ts.dump"; then
            echo "[backup-global] $$ts tamam"
          else
            echo "[backup-global] $$ts BASARISIZ" >&2
          fi
          ls -1t /backups/scalper_global_*.dump 2>/dev/null | tail -n +3 | xargs -r rm -f
          sleep 86400
        done
    logging: *default-logging

volumes:
  scalper_global_data:
  scalper_postgres_global_data:

# Coolify proxy (Traefik) ağı — compose dışında tanımlı external ağ.
# Yerelde (`docker compose up`) çalıştırmak için: `docker network create coolify`
networks:
  coolify:
    external: true
    name: coolify
