<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="globalGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#070b14"/>
  <!-- Globe Grid Wireframe -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#16233d" stroke-width="1.6"/>
  <ellipse cx="32" cy="32" rx="11" ry="23" fill="none" stroke="#1c2d4d" stroke-width="1.2"/>
  <line x1="9" y1="32" x2="55" y2="32" stroke="#1c2d4d" stroke-width="1.2"/>
  <line x1="14" y1="20" x2="50" y2="20" stroke="#16233d" stroke-width="1"/>
  <line x1="14" y1="44" x2="50" y2="44" stroke="#16233d" stroke-width="1"/>
  <!-- Cyber Cyan Dynamic Scalper Trendline -->
  <path d="M14 45 25 31l8 8 16-22" fill="none" stroke="url(#globalGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>
  <!-- Peak Dot -->
  <circle cx="49" cy="17" r="4.5" fill="#00f0ff" filter="url(#cyanGlow)"/>
  <circle cx="49" cy="17" r="2.2" fill="#ffffff"/>
</svg>
